[project]
name = "findex"
version = "0.6.0"
description = "findex — a small full-text search engine built step by step (university course)"
readme = "README.md"
authors = [{ name = "Student" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.28.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: takes more than a second (run with: pytest -m slow, or -m '' for all)"]

[tool.coverage.run]
source = ["findex"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
